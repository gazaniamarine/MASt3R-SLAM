[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fact3r-map"
version = "0.1.0"
description = "MASt3R-grounded persistent entity and semantic mapping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sam2 = ["transformers>=4.56.0", "torch", "Pillow"]
semantic = ["transformers>=4.56.0", "torch", "Pillow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fact3r*"]
